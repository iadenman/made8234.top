<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>홈페이지 공사중 안내</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Noto Sans KR Font -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        kakao: '#FEE500',
                        kakaoDark: '#191919',
                    },
                    fontFamily: {
                        sans: ['Noto Sans KR', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
        }
        .glow {
            box-shadow: 0 0 50px -10px rgba(254, 229, 0, 0.25);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between relative overflow-x-hidden selection:bg-kakao selection:text-kakaoDark">

    <!-- Background Decorative Elements -->
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[600px] h-[600px] bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-0 right-0 w-[400px] h-[400px] bg-yellow-500/5 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Header / Status Badge -->
    <header class="w-full max-w-4xl mx-auto px-6 pt-10 pb-6 flex justify-between items-center z-10">
        <div class="flex items-center space-x-2">
            <span class="w-3 h-3 bg-amber-400 rounded-full animate-ping"></span>
            <span class="text-xs sm:text-sm font-medium tracking-wide text-amber-400 uppercase">Website Under Construction</span>
        </div>
        <div class="text-xs text-slate-400 border border-slate-800 bg-slate-900/80 px-3 py-1.5 rounded-full backdrop-blur-sm">
            <i class="fa-regular fa-clock mr-1.5 text-amber-400"></i>점검 진행 중
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="w-full max-w-xl mx-auto px-6 py-8 flex-1 flex flex-col justify-center items-center text-center z-10">
        
        <!-- Icon Container -->
        <div class="relative mb-8">
            <div class="w-24 h-24 sm:w-28 sm:h-28 bg-gradient-to-tr from-amber-500/20 to-yellow-400/20 rounded-3xl border border-amber-500/30 flex items-center justify-center glow">
                <i class="fa-solid fa-compass-drafting text-4xl sm:text-5xl text-amber-400 animate-pulse"></i>
            </div>
            <div class="absolute -bottom-2 -right-2 bg-kakao text-kakaoDark p-2 rounded-xl text-lg font-bold shadow-lg">
                <i class="fa-solid fa-wrench"></i>
            </div>
        </div>

        <!-- Headline -->
        <h1 class="text-3xl sm:text-4xl md:text-5xl font-extrabold text-white tracking-tight leading-tight mb-4">
            현재 <span class="bg-gradient-to-r from-amber-400 via-yellow-300 to-amber-500 bg-clip-text text-transparent">홈페이지 공사 중</span>입니다
        </h1>

        <!-- Subtext -->
        <p class="text-slate-400 text-sm sm:text-base leading-relaxed mb-10 max-w-md font-light">
            더 안정적이고 나은 서비스를 제공하기 위해 리뉴얼 작업을 진행하고 있습니다. 궁금하신 사항이나 기타 문의는 아래 카카오톡으로 언제든 연락해 주세요.
        </p>

        <!-- KakaoTalk Contact Card -->
        <div class="w-full bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-2xl backdrop-blur-md mb-6 relative group hover:border-amber-500/50 transition-all duration-300">
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
                
                <!-- Kakao Info Left -->
                <div class="flex items-center gap-3.5 text-left w-full sm:w-auto">
                    <div class="w-12 h-12 bg-kakao rounded-xl flex items-center justify-center shrink-0 shadow-md">
                        <i class="fa-solid fa-comment text-kakaoDark text-2xl"></i>
                    </div>
                    <div>
                        <div class="text-xs text-slate-400 font-medium">실시간 카카오톡 문의</div>
                        <div class="text-xl font-bold text-white tracking-wider flex items-center gap-2">
                            ID: <span class="text-kakao" id="kakaoId">v444</span>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex items-center gap-2 w-full sm:w-auto">
                    <button id="copyBtn" onclick="copyKakaoId()" class="w-full sm:w-auto px-6 py-2.5 bg-kakao hover:bg-yellow-300 text-kakaoDark font-bold text-sm rounded-xl transition-all duration-200 flex items-center justify-center gap-2 shadow-lg shadow-yellow-500/10">
                        <i class="fa-regular fa-copy"></i>
                        <span id="copyBtnText">아이디 복사</span>
                    </button>
                </div>

            </div>
        </div>

        <!-- Toast Alert Notification -->
        <div id="toast" class="opacity-0 transition-opacity duration-300 pointer-events-none bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 text-xs px-4 py-2 rounded-full flex items-center gap-2">
            <i class="fa-solid fa-circle-check"></i>
            <span>카카오톡 아이디(v444)가 복사되었습니다!</span>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full max-w-4xl mx-auto px-6 py-8 text-center text-xs text-slate-500 border-t border-slate-900 z-10">
        <p>© <span id="currentYear"></span> All rights reserved. 이용에 불편을 드려 죄송합니다.</p>
    </footer>

    <!-- Copy Script -->
    <script>
        document.getElementById('currentYear').textContent = new Date().getFullYear();

        function copyKakaoId() {
            const kakaoId = "v444";
            
            // Clipboard Copy logic
            navigator.clipboard.writeText(kakaoId).then(() => {
                const copyBtnText = document.getElementById('copyBtnText');
                const toast = document.getElementById('toast');
                
                // Button UI feedback
                copyBtnText.textContent = "복사 완료!";
                
                // Toast Feedback
                toast.classList.remove('opacity-0');
                toast.classList.add('opacity-100');

                setTimeout(() => {
                    copyBtnText.textContent = "아이디 복사";
                    toast.classList.remove('opacity-100');
                    toast.classList.add('opacity-0');
                }, 2500);
            }).catch(err => {
                alert('복사에 실패했습니다. 아이디 v444를 직접 입력해 주세요.');
            });
        }
    </script>
</body>
</html>
